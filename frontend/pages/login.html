<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your PathPilot account.">
  <title>Log in — PathPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../script.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="brand auth-brand" href="../index.html"><span class="brand-mark">P</span> PathPilot</a>
    <section class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in to your account</h1>
      <p class="auth-subtitle">Continue building your learning journey.</p>
      <form id="loginForm">
        <div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
        <div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password"></div>
        <button class="btn btn-primary" type="submit">Log in <span aria-hidden="true">→</span></button>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-switch">New to PathPilot? <a href="register.html">Create an account</a></p>
    </section>
    <a class="back-home" href="../index.html">← Back to homepage</a>
  </main>
</body>
</html>
